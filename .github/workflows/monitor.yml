name: flight-monitor

# 30분마다 항공권 가격을 확인하고, 변경된 DB를 저장소에 커밋한다.
on:
  schedule:
    - cron: "*/30 * * * *"   # UTC 기준 30분 주기 (KST 기준 30분 주기와 동일 간격)
  workflow_dispatch:          # Actions 탭에서 수동 실행 가능

permissions:
  contents: write             # DB 커밋 푸시에 필요

concurrency:
  group: flight-monitor
  cancel-in-progress: false   # 실행 중이면 다음 스케줄은 건너뜀

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 항공권 가격 감시 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: DB 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flights.db
          if git diff --cached --quiet; then
            echo "변경된 데이터가 없어 커밋을 생략합니다."
          else
            git commit -m "chore: 항공권 가격 데이터 갱신 [skip ci]"
            git push
          fi
