name: private-essay-test

# 독서논술 첨삭 실제 사진 시험 (임시). 사진·결과는 암호화된 채로만 오간다.
on:
  push:
    branches: ["claude/**"]
    paths: ["tools/private_test/run.py"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install cryptography pillow numpy
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRANCH: ${{ github.ref_name }}
        run: python tools/private_test/run.py
