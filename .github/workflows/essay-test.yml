name: essay-test

# 독서논술 첨삭 교실 시험용 (임시). claude/** 브랜치에서 tools/essay_test 가 바뀌면 돈다.
on:
  push:
    branches: ["claude/**"]
    paths: ["tools/essay_test/sample.*", "tools/essay_test/run_test.py", "streamlit_app/essay_coach.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow numpy lameenc supertonic
      - name: 시험 첨삭
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/essay_test/run_test.py
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/essay_test/out || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: 독서논술 첨삭 시험 결과 [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
